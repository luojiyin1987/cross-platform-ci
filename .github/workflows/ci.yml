name: Native build matrix self-test

on:
  push:
    branches:
      - main
      - agent/native-build-matrix
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      package: ./cmd/cross-platform-ci
      binary-name: cross-platform-ci
      ldflags: -s -w
